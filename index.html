<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f6e56" />
<title>記帳</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="記帳" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="topbar">
  <h1 class="app-title">記帳</h1>
  <div class="sync-indicator" id="syncIndicator" title="尚未連線 Google Drive">
    <i class="icon">☁</i><span id="syncStatusText">離線</span>
  </div>
</header>

<main id="app">

  <!-- 首頁：本月摘要 + 動態牆歷史列表 -->
  <section id="pane-home" class="pane active">
    <div id="pullIndicator" class="pull-indicator">
      <span id="pullIndicatorText">下拉重新整理</span>
    </div>
    <div class="summary-card">
      <div class="summary-row">
        <div class="summary-col">
          <span class="summary-label">結餘</span>
          <span class="summary-value" id="sumBalance">$0</span>
        </div>
      </div>
      <div class="summary-row summary-row-sub">
        <div class="summary-col">
          <span class="summary-label">支出</span>
          <span class="summary-value summary-expense" id="sumExpense">$0</span>
        </div>
        <div class="summary-col">
          <span class="summary-label">收入</span>
          <span class="summary-value summary-income" id="sumIncome">$0</span>
        </div>
      </div>
    </div>

    <div id="historyList" class="history-list"></div>
    <div id="historyEmpty" class="empty-state" hidden>還沒有任何紀錄，點右下角「＋」開始記帳</div>
  </section>

  <!-- 分析畫面（預留） -->
  <section id="pane-analysis" class="pane">
    <div class="empty-state">分析功能之後會加在這裡<br /><span class="empty-sub">目前資料已同步到 Google Drive，可以先用 Sheets 分析</span></div>
  </section>

  <!-- 設定畫面 -->
  <section id="pane-settings" class="pane">
    <div class="app-version">App 版本：<span id="appVersionText"></span></div>

    <div class="settings-group">
      <h2 class="settings-title">資料整理</h2>
      <p class="settings-hint">多裝置同步後如果出現重複的分類／帳戶／對象／商家，用這個一次清乾淨（保留最早新增的那筆，其餘標記刪除，並自動修正已記錄的交易）。</p>
      <button type="button" id="cleanupDuplicatesBtn" class="add-btn">清除重複項目</button>
    </div>

    <div class="settings-group">
      <h2 class="settings-title">支出分類</h2>
      <div id="expenseCategoryManager" class="manager-list"></div>
      <div class="add-row">
        <input type="text" id="newExpenseCategoryInput" class="text-input" placeholder="新增支出分類" />
        <button type="button" id="addExpenseCategoryBtn" class="add-btn">新增</button>
      </div>
    </div>

    <div class="settings-group">
      <h2 class="settings-title">收入分類</h2>
      <div id="incomeCategoryManager" class="manager-list"></div>
      <div class="add-row">
        <input type="text" id="newIncomeCategoryInput" class="text-input" placeholder="新增收入分類" />
        <button type="button" id="addIncomeCategoryBtn" class="add-btn">新增</button>
      </div>
    </div>

    <div class="settings-pair">
      <div class="settings-group">
        <h2 class="settings-title">帳戶管理</h2>
        <div id="accountManager" class="manager-list"></div>
        <div class="add-row">
          <input type="text" id="newAccountInput" class="text-input" placeholder="新增帳戶名稱" />
          <button type="button" id="addAccountBtn" class="add-btn">新增</button>
        </div>
      </div>

      <div class="settings-group">
        <h2 class="settings-title">商家管理</h2>
        <div id="merchantManager" class="manager-list"></div>
        <div class="add-row">
          <input type="text" id="newMerchantInput" class="text-input" placeholder="新增商家名稱" />
          <button type="button" id="addMerchantBtn" class="add-btn">新增</button>
        </div>
      </div>
    </div>

    <div class="settings-group">
      <h2 class="settings-title">對象管理</h2>
      <div id="recipientManager" class="manager-list"></div>
      <div class="add-row">
        <input type="text" id="newRecipientInput" class="text-input" placeholder="新增對象名稱" />
        <button type="button" id="addRecipientBtn" class="add-btn">新增</button>
      </div>
    </div>

    <div class="settings-group">
      <h2 class="settings-title">雲端同步</h2>
      <div class="drive-status">
        <span id="driveStatusBadge" class="badge badge-muted">尚未連接</span>
        <span id="driveAccountEmail" class="drive-last-sync"></span>
      </div>
      <div class="drive-status">
        <span id="driveLastSync" class="drive-last-sync"></span>
      </div>
      <div class="add-row">
        <button type="button" id="driveConnectBtn" class="add-btn">連接 Google Drive</button>
        <button type="button" id="driveSyncBtn" class="add-btn" hidden>立即同步</button>
      </div>
      <button type="button" id="driveDisconnectBtn" class="delete-btn" hidden>解除連接</button>
    </div>
  </section>

</main>

<button type="button" id="fabAdd" class="fab" aria-label="新增紀錄">＋</button>

<nav class="tabbar">
  <button type="button" class="tab-btn active" data-tab="home"><i class="icon">⌂</i><span>首頁</span></button>
  <button type="button" class="tab-btn" data-tab="analysis"><i class="icon">▤</i><span>分析</span></button>
  <button type="button" class="tab-btn" data-tab="settings"><i class="icon">⚙</i><span>設定</span></button>
</nav>

<!-- 底部彈出記帳／編輯面板 -->
<div id="sheetBackdrop" class="sheet-backdrop" hidden></div>
<div id="entrySheet" class="entry-sheet" hidden>
  <div class="sheet-handle"></div>

  <div class="sheet-header">
    <div class="date-chip-row" id="dateChipRow">
      <button type="button" class="date-chip" data-offset="0">今天</button>
      <button type="button" class="date-chip" data-offset="-1">昨天</button>
      <button type="button" class="date-chip" data-offset="-2">前天</button>
      <label for="dateCalendarInput" class="date-chip date-chip-calendar" id="dateCalendarLabel">📅</label>
      <input type="date" id="dateCalendarInput" class="date-calendar-hidden" />
    </div>
    <div class="date-selected-label" id="dateSelectedLabel"></div>
    <input type="hidden" id="dateInput" />
  </div>

  <div class="sheet-body">

    <div id="sheetFormArea">
      <div class="amount-row">
        <div class="amount-box">
          <span class="amount-label">金額</span>
          <input type="number" inputmode="decimal" id="amountInput" class="amount-input" placeholder="0" min="0" step="1" />
        </div>
        <div class="type-toggle-vertical" id="sheetTypeToggle">
          <button type="button" class="type-btn-v active" data-type="expense">支出</button>
          <button type="button" class="type-btn-v" data-type="income">收入</button>
        </div>
      </div>

      <div class="field-block" id="categoryBlock">
        <div class="field-label">分類</div>
        <div class="chip-grid" id="categoryGrid"></div>
      </div>

      <div class="field-block" id="recipientBlock">
        <div class="field-label">對象（可複選）</div>
        <div class="chip-row" id="recipientRow"></div>
      </div>

      <div class="field-row" id="accountRow">
        <select id="accountSelect" class="field-select"></select>
      </div>

      <div class="field-block" id="merchantBlock">
        <select id="merchantSelect" class="field-select">
          <option value="">商家（選填）</option>
        </select>
      </div>
      <div class="field-block" id="itemNameBlock">
        <input type="text" id="itemNameInput" class="text-input" placeholder="項目名稱（選填）" />
      </div>
      <div class="field-block" id="noteBlock">
        <input type="text" id="noteInput" class="text-input" placeholder="備註（選填）" />
      </div>

      <button type="button" id="saveBtn" class="save-btn">儲存</button>
      <button type="button" id="deleteBtn" class="delete-entry-btn" hidden>刪除這筆</button>
    </div>

    <div id="sheetConfirmArea" class="confirm-area" hidden>
      <div class="confirm-icon">✓</div>
      <div class="confirm-text">已完成</div>
      <div class="confirm-actions">
        <button type="button" id="confirmHomeBtn" class="confirm-btn confirm-btn-secondary">回首頁</button>
        <button type="button" id="confirmAgainBtn" class="confirm-btn confirm-btn-primary">再記一筆</button>
      </div>
    </div>

  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="js/db.js"></script>
<script src="js/drive.js"></script>
<script src="js/app.js"></script>
</body>
</html>
